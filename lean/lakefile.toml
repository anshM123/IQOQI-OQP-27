name = "oqp27"
defaultTargets = ["CGLMPRigidity", "OQP27"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Algebraic rigidity and the canonical DKZ model (from https://github.com/anshM123/CGLMP).
[[lean_lib]]
name = "CGLMPRigidity"
globs = ["CGLMPRigidity.Rigidity", "CGLMPRigidity.Links", "CGLMPRigidity.Model"]

# The formalisation of the maximally entangled clause of OQP 27B (every file, listed explicitly).
[[lean_lib]]
name = "OQP27"
globs = [
  "OQP27.CertDefs",
  "OQP27.CellHerglotz",
  "OQP27.CellClausen",
